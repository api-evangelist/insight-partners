aid: insight-partners
name: Insight Partners
description: >-
  Insight Partners is a global software-focused venture capital and private equity firm founded in 1995
  by Jeff Horing and Jerry Murdock and headquartered in New York City, with additional offices in London,
  Tel Aviv, and Palo Alto. The firm invests in high-growth technology and software ScaleUp companies at
  every stage from early (Series A) through growth and late-stage pre-IPO, deploying checks that range from
  roughly $5M up to $500M+ and pairing capital with a dedicated in-house operations team (Insight Onsite)
  that provides talent, sales, marketing, and product expertise to accelerate scaling. Sector emphasis
  spans enterprise software broadly, including cybersecurity, fintech, AI/ML, DevOps, data infrastructure,
  and healthtech. With approximately $90B in regulatory assets under management as of 2025 and more than
  875 companies backed worldwide, Insight is one of the largest technology investors in the world, with a
  portfolio and exit history that includes Twitter, Shopify, DocuSign, Wix, SentinelOne, HelloFresh, N26,
  Alteryx, and AppDynamics.
